[project]
name = "projects-vc"
version = "0.1.0"
description = "Aqui vamos aprofundar o estudo em visão computacional com diversas tecnologias atuais"
readme = "README.md"
authors = [
    { name = "EddyGiusepe", email = "eddychirinos.unac@gmail.com" }
]
requires-python = ">=3.13, <3.14"
dependencies = [
    "accelerate>=1.13.0",
    "compressed-tensors>=0.17.0",
    "cvzone>=1.6.1",
    "hf-transfer>=0.1.9",
    "mediapipe>=0.10.35",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cudnn-cu12>=9.23.1.3",
    "nvidia-cufft-cu12>=11.4.1.4",
    "onnxruntime>=1.26.0",
    "onnxruntime-gpu>=1.26.0",
    "paddleocr>=3.7.0",
    "pillow>=12.2.0",
    "pygame>=2.6.1",
    "python-dotenv>=1.0.0",
    "streamlit>=1.58.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.68.1",
    "transformers>=5.10.2",
    "ultralytics>=8.4.46",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.16",
]

[tool.black]
target-version = ["py313"]
